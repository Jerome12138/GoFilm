version: '3.8'

services:
  nginx:
    container_name: film_nginx
    image: nginx
    ports:
      - "80:80"
    volumes:
      - /opt/film/data/nginx/html:/usr/share/nginx/html
      - /opt/film/data/nginx/nginx.conf:/etc/nginx/nginx.conf
      - /opt/film/data/nginx/logs:/var/log/nginx
    networks:
      - film-network
    depends_on:
      - film

  film:
    container_name: film_api
    build:
      # 上下文上移到仓库根 → 直接 COPY 根 server/ 进镜像, 不再维护 film/server 快照
      context: ..
      dockerfile: film/Dockerfile
    # 注意: server/config/DataConfig.go 里默认使用开发机 DSN (192.168.20.10:3307),
    # docker compose 启动前请把那行注释掉, 启用下面被注释的 mysql:3306 DSN 行.
    # (env 注入式配置在 roadmap, 待后续替换)
    ports:
      - "3601:3601"
    networks:
      - film-network
    depends_on:
      - mysql
      - redis

  mysql:
    container_name: film_mysql
    image: mysql
    ports:
    - 3610:3306
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: FilmSite
    networks:
      - film-network
    command: [
          'mysqld',
          '--default-authentication-plugin=mysql_native_password',
          '--innodb-buffer-pool-size=80M',
          '--character-set-server=utf8mb4',
          '--collation-server=utf8mb4_unicode_ci',
          '--default-time-zone=+8:00',
          '--lower-case-table-names=1'
        ]

  redis:
    container_name: film_redis
    image: redis
    ports:
      - 3620:6379
    volumes:
      - /opt/film/data/redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - film-network
    command: redis-server /usr/local/etc/redis/redis.conf
networks:
  film-network:
    driver: bridge