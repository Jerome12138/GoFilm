# GoFilm docker-compose
#
# 用法:
#   1. 拷贝 .env.example → .env, 填入生产值
#   2. cd film && docker compose up -d --build
#
# 关键改动 (vs 旧版本):
#   - 全部凭据从 .env 注入, 不再写死
#   - mysql/redis 端口不再对外, 仅容器间网络互通
#   - mysql 用命名卷持久化数据, 重建容器不丢
#   - 镜像版本全部 pin, 不用 latest
#   - depends_on 用 service_healthy 等就绪
#   - 前端构建走 client-v2/Dockerfile, 不再依赖宿主机手工拷贝 dist
#   - 日志用 json-file driver 自动轮转

services:
  nginx:
    container_name: film_nginx
    build:
      context: ..
      dockerfile: client-v2/Dockerfile
    image: gofilm-nginx:latest
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    networks:
      - film-network
    depends_on:
      film:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  film:
    container_name: film_api
    build:
      context: ..
      dockerfile: film/Dockerfile
    image: gofilm-server:latest
    restart: unless-stopped
    environment:
      # ---- 数据库 ----
      MYSQL_DSN: "${MYSQL_USER:-gofilm}:${MYSQL_PASSWORD}@(mysql:3306)/${MYSQL_DATABASE:-FilmSite}?charset=utf8mb4&parseTime=True&loc=Local"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_DB: "0"
      # ---- JWT 密钥, .env 必填; 二选一: 内容直传 or 挂载文件 ----
      JWT_PRIVATE_KEY: "${JWT_PRIVATE_KEY:-}"
      JWT_PUBLIC_KEY: "${JWT_PUBLIC_KEY:-}"
      JWT_PRIVATE_KEY_FILE: "${JWT_PRIVATE_KEY_FILE:-}"
      JWT_PUBLIC_KEY_FILE: "${JWT_PUBLIC_KEY_FILE:-}"
      # ---- CORS 白名单 ----
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
      # ---- 部署模式提示 ----
      GIN_MODE: release
    volumes:
      # 上传图片落盘, 容器重建不丢
      - film_uploads:/opt/server/static/upload
      # 如果用文件挂载 JWT 密钥, 取消注释:
      # - ./secrets:/etc/gofilm/secrets:ro
    networks:
      - film-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # distroless 容器内没 wget, 用 nginx 反代旁路: 改在 nginx 层探活更通用.
      # 这里用 TCP socket open 作为最弱判定, 兜底.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/3601 || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 6
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  mysql:
    container_name: film_mysql
    image: mysql:8.0.36
    restart: unless-stopped
    # 不再 ports: 暴露公网, 仅容器内网络访问
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-FilmSite}"
      MYSQL_USER: "${MYSQL_USER:-gofilm}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - film-network
    command:
      - mysqld
      - --default-authentication-plugin=mysql_native_password
      - --innodb-buffer-pool-size=128M
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+8:00
      - --lower-case-table-names=1
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  redis:
    container_name: film_redis
    image: redis:7.2-alpine
    restart: unless-stopped
    # 不暴露公网端口
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD}"
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data
    networks:
      - film-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

networks:
  film-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  film_uploads:
